<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BPM Rust - Modelado de Procesos</title>
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <div class="left">
          <strong>BPM Rust</strong>
          <span class="subtitle">BPMN · DOP · DAP</span>
        </div>
        <div class="tools" id="tools">
          <button id="btn-open">Abrir</button>
          <button id="btn-save">Guardar JSON</button>
          <button id="btn-export-csv">Exportar CSV</button>
          <span class="sep"></span>
          <button data-add="OPERATION">Operación</button>
          <button data-add="TRANSPORT">Transporte</button>
          <button data-add="INSPECTION">Inspección</button>
          <button data-add="DELAY">Demora</button>
          <button data-add="STORAGE">Almacen.</button>
          <button data-add="COMBINED">Combinada</button>
          <span class="sep"></span>
          <button id="btn-connect" title="Conectar nodos (clic en puerto origen y luego destino)">Conectar</button>
          <button id="btn-delete">Eliminar</button>
          <button id="btn-reset-view">Centrar</button>
          <input id="file-open" type="file" accept=".json,.bpmr.json" style="display:none" />
        </div>
      </header>
      <main class="workspace-area">
        <div class="workspace">
          <canvas id="diagram-canvas"></canvas>
        </div>
        <aside class="panel" id="panel">
          <h3>Propiedades</h3>
          <div id="no-selection" class="muted">Selecciona un nodo para editar sus propiedades.</div>
          <div id="node-form" class="hidden">
            <label>Etiqueta <input id="prop-label" type="text" /></label>
            <label>Tipo <input id="prop-kind" type="text" disabled /></label>
            <label>Tiempo (s) <input id="prop-time" type="number" min="0" step="1" /></label>
            <label>Distancia (m) <input id="prop-dist" type="number" min="0" step="0.1" /></label>
            <label>Recurso <input id="prop-resource" type="text" /></label>
          </div>
          <h3>Resumen DAP</h3>
          <div id="summary-box" class="summary-box"></div>
          <h3>Validación</h3>
          <div id="validation-box" class="validation-box"></div>
        </aside>
      </main>
      <footer class="statusbar" id="statusbar">Listo</footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
