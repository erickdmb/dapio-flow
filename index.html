<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DAPIO-FLOW</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="logo">DF</span>
          <div>
            <strong>DAPIO-FLOW</strong>
            <span class="subtitle">Modelado de procesos BPMN · DOP · DAP</span>
          </div>
        </div>
        <div class="top-actions">
          <button id="btn-new" title="Nuevo diagrama">Nuevo</button>
          <button id="btn-open">Abrir</button>
          <button id="btn-save">Guardar</button>
          <button id="btn-import-bpmn">Importar BPMN</button>
          <span class="sep"></span>
          <button id="btn-export-csv">CSV</button>
          <button id="btn-export-xls">Excel DAP</button>
          <button id="btn-export-bpmn">BPMN 2.0</button>
          <span class="sep"></span>
          <button id="btn-connect" title="Modo conectar (o arrastra desde un puerto)">Conectar</button>
          <button id="btn-delete">Eliminar</button>
          <button id="btn-reset-view">Centrar vista</button>
          <input id="file-open" type="file" accept=".json,.bpmr.json" style="display:none" />
          <input id="file-import-bpmn" type="file" accept=".bpmn,.xml" style="display:none" />
        </div>
      </header>

      <div class="workspace-area">
        <aside class="palette" id="palette">
          <h3>Elementos</h3>
          <div class="muted small">Arrastra un elemento al lienzo</div>
          <div id="palette-items" class="palette-items"></div>
        </aside>

        <main class="workspace">
          <canvas id="diagram-canvas"></canvas>
        </main>

        <aside class="panel" id="panel">
          <h3>Proyecto</h3>
          <div id="project-form">
            <label>Nombre <input id="proj-name" type="text" /></label>
            <label>Notación
              <select id="proj-notation">
                <option value="DAP">DAP</option>
                <option value="DOP">DOP</option>
                <option value="BPMN">BPMN</option>
              </select>
            </label>
            <label>Método
              <select id="proj-method">
                <option value="AS_IS">Actual (AS_IS)</option>
                <option value="TO_BE">Propuesto (TO_BE)</option>
              </select>
            </label>
            <label>Analista <input id="proj-analyst" type="text" /></label>
          </div>
          <h3>Propiedades</h3>
          <div id="no-selection" class="muted">Selecciona un nodo para editar sus propiedades.</div>
          <div id="node-form" class="hidden">
            <label>Etiqueta <input id="prop-label" type="text" /></label>
            <label>Tipo <input id="prop-kind" type="text" disabled /></label>
            <label>Tiempo (s) <input id="prop-time" type="number" min="0" step="1" /></label>
            <label>Distancia (m) <input id="prop-dist" type="number" min="0" step="0.1" /></label>
            <label>Recurso <input id="prop-resource" type="text" /></label>
          </div>
          <h3>Resumen DAP</h3>
          <div id="summary-box" class="summary-box"></div>
          <h3>Validación</h3>
          <div id="validation-box" class="validation-box"></div>
        </aside>
      </div>

      <footer class="statusbar" id="statusbar">Listo</footer>
    </div>

    <div id="start-modal" class="modal">
      <div class="modal-card">
        <h2>DAPIO-FLOW</h2>
        <p>Selecciona el tipo de diagrama para comenzar</p>
        <div class="type-grid">
          <button class="type-card" data-type="DAP"><strong>DAP</strong><span>Diagrama Analítico del Proceso (OIT completo)</span></button>
          <button class="type-card" data-type="DOP"><strong>DOP</strong><span>Diagrama de Operaciones del Proceso (Operación/Inspección)</span></button>
          <button class="type-card" data-type="BPMN"><strong>BPMN</strong><span>Modelado de flujo BPMN 2.0</span></button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
