[workspace]
members = [
  "crates/bpm-core",
  "src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["bpm-rust contributors"]
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
petgraph = "0.6"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }